[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "LLM evaluation harness: suites, metrics, bootstrap statistics, CI gates, LLM-as-judge and shared model clients."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "psutil>=5.9",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
    "openai==3.41.0",
    "anthropic==2.3.0",
    "google-genai==2.34.0",
]

[project.scripts]
evalh = "evalharness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "respx>=0.21",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
