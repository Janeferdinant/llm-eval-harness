# USD per 1M tokens, standard (non-batch, non-cached) rates for short prompts.
# Each entry is dated. `valid_until` marks a price that is announced to change; after that date
# cost_usd() returns None instead of a stale number.
# Sources (read 2026-10-30):
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://developers.openai.com/api/docs/pricing
#   Google:    https://ai.google.dev/gemini-api/docs/pricing
# Local models and free tiers cost 0 and are not listed; electricity is not counted.
entries:
  - {provider: anthropic, model: claude-fable-5-1,  input_per_m: 10.00, output_per_m: 50.00, as_of: 2026-10-30}
  - {provider: anthropic, model: claude-opus-5-5,   input_per_m: 4.00,  output_per_m: 20.00, as_of: 2026-10-30}
  - {provider: anthropic, model: claude-sonnet-5-5, input_per_m: 2.00,  output_per_m: 10.00, as_of: 2026-10-30}
  # Haiku 5.5 is $0.10 / $0.50 for prompts up to 100,000 tokens; the long-prompt rate is higher.
  - {provider: anthropic, model: claude-haiku-5-5,  input_per_m: 0.10,  output_per_m: 0.50,  as_of: 2026-10-30}
  - {provider: openai, model: gpt-6-astra,   input_per_m: 10.00, output_per_m: 50.00, as_of: 2026-10-30}
  - {provider: openai, model: gpt-6.1-sol,   input_per_m: 2.00,  output_per_m: 10.00, as_of: 2026-10-30}
  - {provider: openai, model: gpt-6.1-terra, input_per_m: 1.00,  output_per_m: 5.00,  as_of: 2026-10-30}
  - {provider: openai, model: gpt-6-luna,    input_per_m: 0.10,  output_per_m: 0.50,  as_of: 2026-10-30}
  # Gemini 4 Argon paid tier: $2 / $10 through 2026-11-30, then $4 / $20 from 2026-12-01.
  - {provider: google, model: gemini-4-argon, input_per_m: 2.00, output_per_m: 10.00, as_of: 2026-10-30, valid_until: 2026-11-30}
